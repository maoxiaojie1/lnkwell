[package]
name = "lnkwell"
version = "0.1.0"
description = "Offline-first Markdown reader"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lnkwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 文件访问全部走自定义命令（vault 模块），不再挂 tauri-plugin-fs；
# 图片走 data URL，不需要 asset 协议（改进计划 C1）
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
# 外链交给系统浏览器（改进计划 A10）：Tauri WebView 会吞掉 window.open
tauri-plugin-opener = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 桌面单实例：已在运行时再次双击 md 文件，把路径转发给既有实例（须最先注册）
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# 桌面导出 PDF：直接调 WebView2 的 PrintToPdf（绕过打印对话框，消除默认页眉页脚的 localhost URL）
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "=29.0.0"
android_logger = "0.14"

[dev-dependencies]
# 集成测试用：还原 md-rel:// 哨兵里的 percent-encoding（改进计划 C3）
percent-encoding = "2"


[profile.release]
lto = true
codegen-units = 1
strip = true
# 刻意不设 panic = "abort"：移动端需要 unwind 把 panic 传回 WebView（见方案 §3.3）

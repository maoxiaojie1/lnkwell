<!doctype html>
<html lang="zh-CN" data-theme="github-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lnkwell</title>
    <!-- 首屏关键 CSS 内联（方案 §8.3：不等外链 CSS，防闪白） -->
    <style>
      /* 启动层跟随系统明暗，避免"先黑后白"的闪烁 */
      html, body { margin: 0; height: 100%; background: #fcfcfa; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #14161b; }
      }
      html[data-theme="github-light"] body { background: #fcfcfa; }
      html[data-theme="sepia"] body { background: #f7f1e3; }
      #boot {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        color: #8b95a3; font-family: -apple-system, 'Noto Sans SC', sans-serif;
        font-size: 13px; letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot">加载中…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
